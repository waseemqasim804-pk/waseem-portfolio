<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Python Gradio and Groq chat flow</title><desc id="desc">A user interacts with Gradio, a server-side Python function sends a protected API request, and the assistant response returns to the interface.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151b"/><stop offset="1" stop-color="#20252f"/></linearGradient><linearGradient id="arrow" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs><rect width="1600" height="900" rx="42" fill="url(#bg)"/><g fill="#191e27" stroke="#596477" stroke-width="3"><rect x="100" y="330" width="290" height="220" rx="28"/><rect x="510" y="330" width="300" height="220" rx="28"/><rect x="930" y="330" width="300" height="220" rx="28"/><rect x="1320" y="330" width="190" height="220" rx="28" stroke="#f97316"/></g>
  <g fill="none" stroke="url(#arrow)" stroke-width="7"><path d="M390 400h120m300 0h120m300 0h90"/><path d="m490 382 20 18-20 18m280-36 20 18-20 18m280-36 20 18-20 18m70-18-20-18m20 18-20 18"/></g><g fill="#f8fafc" font-family="sans-serif" text-anchor="middle"><text x="245" y="405" font-size="29" font-weight="700">Visitor</text><text x="245" y="458" font-size="21" fill="#aeb9ca">message</text><text x="660" y="405" font-size="29" font-weight="700">Gradio UI</text><text x="660" y="458" font-size="21" fill="#aeb9ca">Python handler</text><text x="1080" y="405" font-size="29" font-weight="700">Groq API</text><text x="1080" y="458" font-size="21" fill="#aeb9ca">server-side key</text><text x="1415" y="405" font-size="26" font-weight="700">Reply</text><text x="1415" y="458" font-size="19" fill="#aeb9ca">plain text</text></g><path d="M1410 620H245" stroke="#667184" stroke-width="4" stroke-dasharray="12 15"/><path d="m265 602-20 18 20 18" fill="none" stroke="#60a5fa" stroke-width="6"/><text x="800" y="690" fill="#cbd5e1" font-family="sans-serif" font-size="21" text-anchor="middle">Validate output and handle errors before rendering the response</text><text x="800" y="175" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">A SMALL, SERVER-SIDE CHAT COMPLETION FLOW</text>
