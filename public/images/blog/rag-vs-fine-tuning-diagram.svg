<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RAG and fine-tuning adaptation paths</title><desc id="desc">RAG sends changing documents through retrieval into request context; fine-tuning sends reviewed examples through training into an adapted model.</desc>
