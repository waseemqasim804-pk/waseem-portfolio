<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket connection lifecycle</title><desc id="desc">A React client opens a WebSocket with FastAPI, exchanges validated messages, and handles disconnect and cleanup.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151b"/><stop offset="1" stop-color="#20252d"/></linearGradient><linearGradient id="link" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs><rect width="1600" height="900" rx="42" fill="url(#bg)"/><g fill="#191e27" stroke="#596477" stroke-width="3"><rect x="150" y="260" width="390" height="420" rx="30"/><rect x="1060" y="260" width="390" height="420" rx="30"/></g><text x="345" y="330" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">React client</text><text x="1255" y="330" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">FastAPI server</text><g fill="#cbd5e1" font-family="sans-serif" font-size="22" text-anchor="middle"><text x="345" y="420">connect + show state</text><text x="345" y="510">validate incoming event</text><text x="345" y="600">close on cleanup</text><text x="1255" y="420">authenticate + accept</text><text x="1255" y="510">validate typed message</text><text x="1255" y="600">handle disconnect</text></g><path d="M560 420h480M1040 520H560" stroke="url(#link)" stroke-width="7"/><path d="m1018 398 22 22-22 22m-436 56-22 22 22 22" fill="none" stroke="#f8fafc" stroke-width="6"/><text x="800" y="755" fill="#aeb9ca" font-family="sans-serif" font-size="22" text-anchor="middle">Messages are transient unless the application stores and recovers them.</text>
</svg>
