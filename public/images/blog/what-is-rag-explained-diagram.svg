<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-augmented generation pipeline</title><desc id="desc">Documents are chunked and embedded, indexed, searched for a question, and passed as evidence to an LLM that returns an answer with sources.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151b"/><stop offset="1" stop-color="#1d222c"/></linearGradient><linearGradient id="arrow" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs><rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <g fill="#191e27" stroke="#556174" stroke-width="3"><rect x="75" y="340" width="220" height="180" rx="24"/><rect x="365" y="340" width="220" height="180" rx="24"/><rect x="655" y="340" width="220" height="180" rx="24"/><rect x="945" y="340" width="220" height="180" rx="24"/><rect x="1235" y="340" width="290" height="180" rx="24"/></g><g stroke="url(#arrow)" stroke-width="7" fill="none"><path d="M295 430h70M585 430h70M875 430h70M1165 430h70"/><path d="m345 412 20 18-20 18m290-36 20 18-20 18m290-36 20 18-20 18m290-36 20 18-20 18"/></g>
  <g fill="#f8fafc" font-family="sans-serif" text-anchor="middle"><text x="185" y="405" font-size="27" font-weight="700">Documents</text><text x="185" y="455" font-size="20" fill="#aeb9ca">extract + chunk</text><text x="475" y="405" font-size="27" font-weight="700">Embeddings</text><text x="475" y="455" font-size="20" fill="#aeb9ca">vectorize text</text><text x="765" y="405" font-size="27" font-weight="700">Vector store</text><text x="765" y="455" font-size="20" fill="#aeb9ca">index + metadata</text><text x="1055" y="405" font-size="27" font-weight="700">Retrieval</text><text x="1055" y="455" font-size="20" fill="#aeb9ca">rank evidence</text><text x="1380" y="405" font-size="27" font-weight="700">LLM answer</text><text x="1380" y="455" font-size="20" fill="#aeb9ca">context + sources</text></g><text x="800" y="165" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">A QUESTION RETRIEVES CONTEXT BEFORE GENERATION</text><text x="800" y="730" fill="#fb923c" font-family="sans-serif" font-size="22" text-anchor="middle">Filter by permissions · Preserve source IDs · Return an honest fallback when evidence is missing</text>
</svg>
