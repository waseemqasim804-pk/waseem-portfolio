<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Object detection prediction fields</title><desc id="desc">A frame shows a detected object with an xyxy bounding box, class label, and confidence score connected to structured result data.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151b"/><stop offset="1" stop-color="#20252d"/></linearGradient></defs><rect width="1600" height="900" rx="42" fill="url(#bg)"/><rect x="120" y="235" width="790" height="500" rx="34" fill="#171c24" stroke="#586477" stroke-width="3"/><path d="M250 680 430 390l180 290zM590 680l105-210 150 210z" fill="#364253"/><circle cx="475" cy="350" r="58" fill="#4c5b6f"/><rect x="325" y="300" width="390" height="395" fill="none" stroke="#fb923c" stroke-width="6"/><rect x="325" y="255" width="270" height="44" rx="10" fill="#f97316"/><text x="345" y="285" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">class · confidence</text><g fill="#191e27" stroke="#536075" stroke-width="3"><rect x="1030" y="250" width="430" height="105" rx="20"/><rect x="1030" y="400" width="430" height="105" rx="20"/><rect x="1030" y="550" width="430" height="105" rx="20"/></g><g fill="#f8fafc" font-family="monospace" font-size="23"><text x="1080" y="315">box.xyxy → [x1, y1, x2, y2]</text><text x="1080" y="465">box.conf → model score</text><text x="1080" y="615">box.cls → result.names[id]</text></g><path d="M910 470h90" stroke="#60a5fa" stroke-width="6"/><path d="m980 450 20 20-20 20" fill="none" stroke="#60a5fa" stroke-width="6"/><text x="800" y="150" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">A PREDICTION IS STRUCTURED, NOT JUST A RECTANGLE</text>
</svg>
