<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Firestore authorization decision flow</title><desc id="desc">A client request passes identity, ownership, and data validation checks before access to a Firestore document is allowed or denied.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151b"/><stop offset="1" stop-color="#20252d"/></linearGradient></defs><rect width="1600" height="900" rx="42" fill="url(#bg)"/><g fill="#191e27" stroke="#596477" stroke-width="3"><rect x="100" y="380" width="220" height="135" rx="24"/><rect x="440" y="270" width="260" height="130" rx="24"/><rect x="440" y="500" width="260" height="130" rx="24"/><rect x="840" y="380" width="250" height="150" rx="28" stroke="#fb923c"/><rect x="1240" y="260" width="250" height="130" rx="24"/><rect x="1240" y="520" width="250" height="130" rx="24"/></g><g fill="none" stroke="#7c8ba1" stroke-width="5"><path d="M320 445h120M700 335h70q70 0 70 70v50m-140 110h70q70 0 70-70v-40M1090 420h80q70 0 70-70m-150 130h80q70 0 70 105"/></g><g fill="#f8fafc" font-family="sans-serif" text-anchor="middle"><text x="210" y="435" font-size="24">Client request</text><text x="570" y="325" font-size="23">Authenticated?</text><text x="570" y="555" font-size="23">Valid data?</text><text x="965" y="450" font-size="25" font-weight="700">Firestore rules</text><text x="1365" y="315" font-size="25" fill="#86efac">Allow</text><text x="1365" y="575" font-size="25" fill="#fca5a5">Deny</text></g><text x="800" y="175" fill="#f8fafc" font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle">POLICY AT THE DATABASE BOUNDARY</text><text x="800" y="750" fill="#aeb9ca" font-family="sans-serif" font-size="22" text-anchor="middle">Queries must guarantee every possible result satisfies the read rule.</text>
</svg>
