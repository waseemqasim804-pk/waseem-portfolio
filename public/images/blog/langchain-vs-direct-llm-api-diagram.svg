<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Direct API and framework orchestration comparison</title><desc id="desc">A direct request path is compared with a composable path containing retrieval, prompt assembly, and model invocation.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151b"/><stop offset="1" stop-color="#20252e"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="orange" x2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#fdba74"/></linearGradient></defs><rect width="1600" height="900" rx="42" fill="url(#bg)"/><text x="400" y="205" fill="#f8fafc" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">DIRECT CALL</text><text x="1200" y="205" fill="#f8fafc" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">COMPOSED PIPELINE</text><g fill="#191e27" stroke="#596477" stroke-width="3"><rect x="130" y="340" width="230" height="150" rx="25"/><rect x="480" y="340" width="270" height="150" rx="25"/><rect x="850" y="320" width="200" height="100" rx="20"/><rect x="850" y="450" width="200" height="100" rx="20"/><rect x="850" y="580" width="200" height="100" rx="20"/><rect x="1215" y="400" width="250" height="150" rx="25"/></g><g fill="none" stroke-width="7"><path d="M360 415h120" stroke="url(#blue)"/><path d="M750 415h100q50 0 50-45v0m0 45v80m0 0v75q0 45 50 45h165" stroke="url(#orange)"/></g><g fill="#f8fafc" font-family="sans-serif" font-size="22" text-anchor="middle"><text x="245" y="405">Question</text><text x="245" y="445" fill="#aeb9ca">input</text><text x="615" y="405">Provider SDK</text><text x="615" y="445" fill="#aeb9ca">request + response</text><text x="950" y="380">Retrieve</text><text x="950" y="510">Build prompt</text><text x="950" y="640">Invoke model</text><text x="1340" y="465">Answer</text><text x="1340" y="505" fill="#aeb9ca">validated output</text></g><text x="800" y="770" fill="#cbd5e1" font-family="sans-serif" font-size="22" text-anchor="middle">An abstraction helps when these steps repeat; keep their behavior observable.</text>
</svg>
